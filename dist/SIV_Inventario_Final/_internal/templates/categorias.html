{% extends 'base.html' %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-2"></i> Volver al Panel de Control
        </a>
    </div>
</div>

<div class="row">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Nueva Categoría</h5>
            </div>
            <div class="card-body">
                <form action="{{ url_for('inventario.categorias') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre de Categoría</label>
                        <input type="text" name="nombre" class="form-control" placeholder="Ej. Zapatos, Camisas..." required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Guardar</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">Categorías Existentes</h5>
            </div>
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for cat in categorias %}
                        <tr>
                            <td>{{ cat.id }}</td>
                            <td>{{ cat.nombre }}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-danger">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
